name: Release firmware

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Create CI configuration
        run: |
          cat > include/config.h <<'EOF'
          #ifndef CONFIG_H
          #define CONFIG_H
          const char* GOOGLE_SCRIPT_URL = "https://example.invalid/exec";
          #endif
          EOF

      - name: Build firmware
        run: pio run

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .pio/build/esp32dev/firmware.bin
