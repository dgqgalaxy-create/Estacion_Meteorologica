; --- Entorno por defecto para `pio run` / `pio run -t upload` ---
[platformio]
default_envs = esp32dev

; Configuración común (compilación, librerías, placa)
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- Librerías estrictamente necesarias ---
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    tzapu/WiFiManager @ ^2.0.17
    ; WiFi, WebServer, HTTPClient, Preferences, etc. vienen con el framework Arduino

; --- Optimizaciones para estabilidad y tamaño de binario ---
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF32
    -Wno-deprecated-declarations
    -Os                          ; Optimizar por tamaño (reduce el binario OTA)
    -DCORE_DEBUG_LEVEL=0         ; Desactivar logs de depuración del core en producción
    -Iinclude
    -D FIRMWARE_VERSION=\"1.3.1\"

; --- Configuración de la placa ---
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = default.csv   ; Partición estándar (OTA segura)

; --- Monitor serie ---
monitor_filters =
    esp32_exception_decoder
    colorize

; --- Carga OTA local por WiFi (entorno por defecto) ---
[env:esp32dev]
extends = env
upload_protocol = espota
upload_port = estacion-clima.local   ; Si falla, usa la IP (ej: 192.168.1.45)
upload_flags = --auth=04330          ; Debe coincidir con WEB_PASSWORD de include/config.h

; --- Carga por cable USB (primera carga o emergencias) ---
; Uso: pio run -e usb -t upload
[env:usb]
extends = env
upload_protocol = esptool
upload_port = /dev/ttyUSB0           ; Ajusta el puerto a tu sistema (ej: COM3, /dev/cu.usbserial-0001)
upload_speed = 921600
